# server.toml
[server]
bind_addr = "0.0.0.0:13333" # `2333` 配置了服务端监听客户端连接的端口

[server.services.my_nas_ssh]
token = "use_a_secret_that_only_you_know" # 用于验证的 token
bind_addr = "0.0.0.0:13334" # `5202` 配置了将 `my_nas_ssh` 暴露给互联网的端口
[server.services.guang_mao]
token = "11234" # 必须与服务器相同以通过验证
bind_addr = "0.0.0.0:13335" # 需要被转发的服务的地址